/**
 * Filtra y ordena las solicitudes en memoria.
 */
function filtrarTablaEnCurso() {
  const q = (document.getElementById('filter-ec-search')?.value || '').toLowerCase().trim();
  const estado = document.getElementById('filter-ec-estado')?.value || '';
  const actor = document.getElementById('filter-ec-actor')?.value || '';
  const tipo = document.getElementById('filter-ec-tipo')?.value || '';
  const clasif = document.getElementById('filter-ec-clasificacion')?.value || '';

  ec_filtradas = ec_todas_solicitudes.filter(item => {
    if (q) {
      const matchId = (item.idSolicitud || '').toLowerCase().includes(q);
      const matchSol = (item.solicitante || '').toLowerCase().includes(q);
      const matchCC = (item.codigoCC || '').toLowerCase().includes(q);
      if (!matchId && !matchSol && !matchCC) return false;
    }
    if (estado && (item.estadoSolicitud || '').toUpperCase() !== estado.toUpperCase()) return false;
    if (actor && (item.actorActual || '').toLowerCase() !== actor.toLowerCase()) return false;
    if (tipo && (item.tipoViatico || '').toLowerCase() !== tipo.toLowerCase()) return false;
    if (clasif && (item.clasificacionSolicitud || '').toLowerCase() !== clasif.toLowerCase()) return false;

    return true;
  });

  // Ordenar por fecha
  ec_filtradas.sort((a, b) => {
    const da = parseFechaHoraEnCurso(a.fechaSolicitud);
    const db = parseFechaHoraEnCurso(b.fechaSolicitud);
    return ec_sort_desc ? (db - da) : (da - db);
  });

  ec_page = 1;
  renderTablaEnCurso();
}

function parseFechaHoraEnCurso(str) {
  if (!str) return new Date(0);
  const parts = str.split(' ');
  const dateParts = parts[0].split('/');
  if (dateParts.length === 3) {
    const day = parseInt(dateParts[0]);
    const month = parseInt(dateParts[1]) - 1;
    const year = parseInt(dateParts[2]);
    let hour = 0, min = 0;
    if (parts[1]) {
      const timeParts = parts[1].split(':');
      hour = parseInt(timeParts[0]) || 0;
      min = parseInt(timeParts[1]) || 0;
    }
    return new Date(year, month, day, hour, min);
  }
  return new Date(str);
}

/**

        </td>
        <td class="py-3 px-3 text-center text-xs font-semibold text-primary align-middle">
          <span class="px-2 py-0.5 rounded bg-surface-container text-[11px]">${item.actorActual || '-'}</span>
        </td>

          ${item.tipoViatico}
        </td>

            Ver detalles
          </button>
        </td>
      </tr>
    `;
  }).join('');

  renderPaginacionEnCurso(total, Math.ceil(total / ec_page_size));
}

function generarBadgeEstadoEnCurso(estado) {
  const est = (estado || '').toUpperCase();
  if (est === 'INICIADO') {
    return '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold bg-blue-100 text-blue-800 border border-blue-200">INICIADO</span>';
  } else if (est === 'AUTORIZADO') {
    return '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-200">AUTORIZADO</span>';
  } else if (est === 'ENVIADO A PAGO') {
    return '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold bg-purple-100 text-purple-800 border border-purple-200">ENVIADO A PAGO</span>';
  } else if (est === 'PAGADO') {
    return '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold bg-teal-100 text-teal-800 border border-teal-200">PAGADO</span>';
  } else if (est === 'LIQUIDADO') {
    return '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold bg-indigo-100 text-indigo-800 border border-indigo-200">LIQUIDADO</span>';
  } else if (est.includes('RECHAZO')) {
    return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold bg-amber-100 text-amber-900 border border-amber-300"><i class="fas fa-exclamation-triangle text-[9px] text-amber-600"></i>${est}</span>`;
  }
  return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold bg-gray-100 text-gray-800">${est}</span>`;
}

function renderPaginacionEnCurso(total, totalPages) {
  const container = document.getElementById('ec-paginacion-controles');
  if (!container) return;

  if (totalPages <= 1) {
    container.innerHTML = '';
    return;
  }

  let html = `
    <button onclick="cambiarPaginaEnCurso(${ec_page - 1})" ${ec_page === 1 ? 'disabled' : ''} class="px-3 py-1 border border-outline-variant rounded text-xs font-medium hover:bg-surface-container transition-colors disabled:opacity-40 disabled:pointer-events-none cursor-pointer">
      Anterior
    </button>
  `;

  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || (i >= ec_page - 1 && i <= ec_page + 1)) {
      html += `
        <button onclick="cambiarPaginaEnCurso(${i})" class="px-3 py-1 border ${i === ec_page ? 'bg-primary text-on-primary font-bold border-primary' : 'border-outline-variant hover:bg-surface-container'} rounded text-xs transition-colors cursor-pointer">
          ${i}
        </button>
      `;
    } else if (i === ec_page - 2 || i === ec_page + 2) {
      html += `<span class="px-1 text-xs text-outline">...</span>`;
    }
  }

  html += `
    <button onclick="cambiarPaginaEnCurso(${ec_page + 1})" ${ec_page === totalPages ? 'disabled' : ''} class="px-3 py-1 border border-outline-variant rounded text-xs font-medium hover:bg-surface-container transition-colors disabled:opacity-40 disabled:pointer-events-none cursor-pointer">
      Siguiente
    </button>
  `;

  container.innerHTML = html;
}

function cambiarPaginaEnCurso(p) {
  ec_page = p;
  renderTablaEnCurso();
}

function cambiarPageSizeEnCurso(size) {
  ec_page_size = parseInt(size) || 10;
  ec_page = 1;
  renderTablaEnCurso();
}

function toggleSortDateEnCurso() {

  const icon = document.getElementById('ec-sort-icon');
  if (icon) icon.className = ec_sort_desc ? 'fas fa-sort-down text-xs text-primary' : 'fas fa-sort-up text-xs text-primary';
  filtrarTablaEnCurso();
}

function limpiarFiltrosEnCurso() {
  const fields = ['filter-ec-search', 'filter-ec-estado', 'filter-ec-actor', 'filter-ec-tipo', 'filter-ec-clasificacion'];
  fields.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  filtrarTablaEnCurso();
}

          <i class="fas fa-paperclip text-primary text-sm"></i>
          <span class="text-xs font-semibold text-primary truncate flex-1">${arch.NombreArchivo || 'Archivo adjunto'}</span>
          <i class="fas fa-external-link-alt text-[10px] text-outline"></i>
        </a>
      `).join('');
    } else {
      listaArch.innerHTML = '<span class="text-xs text-outline italic">No hay comprobantes adjuntos.</span>';
    }
  }

  // 4. BLOQUE CONDICIONAL: AUTORIZACIONES
  const secAut = document.getElementById('ec-seccion-autorizaciones');
  const tbodyAut = document.getElementById('ec-det-aut-body');
  if (exp.datosAutorizacion && exp.datosAutorizacion.length > 0) {
    secAut?.classList.remove('hidden');
    if (tbodyAut) {
      tbodyAut.innerHTML = exp.datosAutorizacion.map(aut => `
        <tr class="hover:bg-surface-container-low transition-colors">
          <td class="py-2 px-3 text-center font-semibold text-primary">${aut.nombre || ('Nivel ' + aut.nivel)}</td>
          <td class="py-2 px-3 text-center text-on-surface-variant">${aut.fecha || '-'}</td>
          <td class="py-2 px-3 text-center">
            <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-bold ${aut.resolucion === 'APROBADO' ? 'bg-emerald-100 text-emerald-800' : aut.resolucion === 'JUSTIFICADO' ? 'bg-blue-100 text-blue-800' : 'bg-gray-100 text-gray-800'}">
              ${aut.resolucion || 'REGISTRADO'}
            </span>
          </td>
          <td class="py-2 px-3 text-left text-on-surface leading-relaxed">${aut.comentario || '-'}</td>
        </tr>
      `).join('');
    }
  } else {
    secAut?.classList.add('hidden');
  }

  // 5. BLOQUE CONDICIONAL: PROVISIÓN (COMPRAS)
  const secProv = document.getElementById('ec-seccion-provision');
  if (exp.nombreProvision || exp.fechaProvision || exp.agrupableProvision) {
    secProv?.classList.remove('hidden');
    document.getElementById('ec-det-prov-nombre').textContent = exp.nombreProvision || 'Gestor Compras';
    document.getElementById('ec-det-prov-fecha').textContent = exp.fechaProvision || '-';
    document.getElementById('ec-det-prov-res').textContent = exp.resolucionProvision || 'Aprobado';
    document.getElementById('ec-det-prov-comentario').textContent = exp.comentarioProvision || 'Provisión contable realizada.';

    const asientoCard = document.getElementById('ec-det-prov-asiento-card');
    if (exp.agrupableProvision) {
      asientoCard?.classList.remove('hidden');
      document.getElementById('ec-as-prov-fcont').textContent = exp.agrupableProvision.fechaContable || '-';
      document.getElementById('ec-as-prov-fval').textContent = exp.agrupableProvision.fechaValor || '-';
      document.getElementById('ec-as-prov-mod').textContent = exp.agrupableProvision.modulo || '-';
      document.getElementById('ec-as-prov-tra').textContent = exp.agrupableProvision.transaccion || '-';
      document.getElementById('ec-as-prov-cod').textContent = exp.agrupableProvision.codigoRelacion || '-';
      document.getElementById('ec-as-prov-cr').textContent = exp.agrupableProvision.crFse || '-';
    } else {
      asientoCard?.classList.add('hidden');
    }
  } else {
    secProv?.classList.add('hidden');
  }

  // 6. BLOQUE CONDICIONAL: PROCESAMIENTO PAGO (TESORERÍA)
  const secProc = document.getElementById('ec-seccion-procesamiento');
  if (exp.nombreProcesamiento || exp.fechaProcesamiento || exp.agrupableProcesamiento) {
    secProc?.classList.remove('hidden');
    document.getElementById('ec-det-proc-nombre').textContent = exp.nombreProcesamiento || 'Gestor Tesorería';
    document.getElementById('ec-det-proc-fecha').textContent = exp.fechaProcesamiento || '-';
    document.getElementById('ec-det-proc-res').textContent = exp.resolucionProcesamiento || 'Aprobado';
    document.getElementById('ec-det-proc-comentario').textContent = exp.comentarioProcesamiento || 'Desembolso bancario ejecutado.';

    const asientoCardP = document.getElementById('ec-det-proc-asiento-card');
    if (exp.agrupableProcesamiento) {
      asientoCardP?.classList.remove('hidden');
      document.getElementById('ec-as-proc-fcont').textContent = exp.agrupableProcesamiento.fechaContable || '-';
      document.getElementById('ec-as-proc-fval').textContent = exp.agrupableProcesamiento.fechaValor || '-';
      document.getElementById('ec-as-proc-mod').textContent = exp.agrupableProcesamiento.modulo || '-';
      document.getElementById('ec-as-proc-tra').textContent = exp.agrupableProcesamiento.transaccion || '-';
      document.getElementById('ec-as-proc-cod').textContent = exp.agrupableProcesamiento.codigoRelacion || '-';
      document.getElementById('ec-as-proc-cr').textContent = exp.agrupableProcesamiento.crFse || '-';
    } else {
      asientoCardP?.classList.add('hidden');
    }
  } else {
    secProc?.classList.add('hidden');
  }

  // 7. BLOQUE CONDICIONAL: LIQUIDACIÓN Y CIERRE (SOLICITANTE Y COMPRAS)
  const secCierre = document.getElementById('ec-seccion-cierre');
  if (exp.fechaCierreS || exp.nombreCierreE || exp.agrupableCierreE || exp.montoReintegro > 0) {
    secCierre?.classList.remove('hidden');
    document.getElementById('ec-det-cierre-tipo').textContent = exp.tipoCierre || 'Solo cierre';
    document.getElementById('ec-det-cierre-monto').textContent = exp.montoReintegro ? ('$ ' + parseFloat(exp.montoReintegro).toFixed(2)) : '$ 0.00';
    document.getElementById('ec-det-cierre-fechas').textContent = exp.fechaCierreS || '-';
    document.getElementById('ec-det-cierre-fechae').textContent = exp.fechaCierreE || '-';

    const boxCompras = document.getElementById('ec-det-cierre-compras-box');
    if (exp.nombreCierreE) {
      boxCompras?.classList.remove('hidden');
      document.getElementById('ec-det-cierre-nombre-e').textContent = exp.nombreCierreE;
      document.getElementById('ec-det-cierre-res-e').textContent = exp.resolucionCierreE || 'Aprobado';
      document.getElementById('ec-det-cierre-comentario-e').textContent = exp.comentarioCierreE || '-';
    } else {
      boxCompras?.classList.add('hidden');
    }

    const asientoCardC = document.getElementById('ec-det-cierre-asiento-card');
    if (exp.agrupableCierreE) {
      asientoCardC?.classList.remove('hidden');
      document.getElementById('ec-as-cierre-fcont').textContent = exp.agrupableCierreE.fechaContable || '-';
      document.getElementById('ec-as-cierre-fval').textContent = exp.agrupableCierreE.fechaValor || '-';
      document.getElementById('ec-as-cierre-mod').textContent = exp.agrupableCierreE.modulo || '-';
      document.getElementById('ec-as-cierre-tra').textContent = exp.agrupableCierreE.transaccion || '-';
      document.getElementById('ec-as-cierre-cod').textContent = exp.agrupableCierreE.codigoRelacion || '-';
      document.getElementById('ec-as-cierre-cr').textContent = exp.agrupableCierreE.crFse || '-';
    } else {
      asientoCardC?.classList.add('hidden');
    }
  } else {
    secCierre?.classList.add('hidden');
  }
}

function regresarTablaEnCurso() {
  const bandeja = document.getElementById('en-curso-bandeja');
  const detalle = document.getElementById('view-en-curso-detalle');

  if (detalle) detalle.classList.add('vista-oculta');
  if (bandeja) bandeja.classList.remove('hidden');
}

function imprimirExpedienteEnCurso() {
  window.print();
}
</script>
