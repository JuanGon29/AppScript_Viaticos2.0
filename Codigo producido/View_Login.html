<section id="view-login" class="vista-activa bg-background w-full h-full">
  <div class="flex h-full w-full">
    
    <!-- Panel Izquierdo: Imagen Editorial Corporativa (60%) -->
    <div class="hidden lg:block lg:w-[60%] h-full relative">
      <div class="absolute inset-0 bg-primary-container/80 z-10"></div>
      <div class="bg-cover bg-center w-full h-full absolute inset-0 z-0" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuA7Q9Pg38YY7phaxZg8X8LNr_qLy8Ds3sCj-GqdPUvXtOVUG2e9seCalt-y8MndUpMUkUE7YtAQnwL9SytQfIHGRnBFfe7KfDJcG07_zo_AcWP22xeXIWKe_dICjC89HNqr8lzcsv4MkIUcywOUop1mb96Q11oA6OyiEWWSTM2I_zQNqCllHW78xztSiq1C9cNlDr9hdeB-KNevvieNYjABtQFZhAioou9EprXQmzOOobqE3cWi_kpNBg')"></div>
      
      <!-- Contenido sobre la Imagen -->
      <div class="relative z-20 h-full flex flex-col justify-end p-xl">
        <h1 class="font-display-lg text-display-lg text-on-primary mb-md max-w-xl">Gestión Corporativa de Viáticos</h1>
        <p class="font-body-lg text-body-lg text-on-primary/80 max-w-lg">Plataforma integral para el registro, aprobación y control de gastos corporativos. Eficiencia y transparencia para tu equipo.</p>
      </div>
    </div>

    <!-- Panel Derecho: Formulario de Acceso y Perfil de Usuario (40%) -->
    <div class="w-full lg:w-[40%] h-full bg-surface flex flex-col justify-between px-margin-mobile lg:px-margin-desktop py-lg overflow-y-auto">
      
      <!-- Encabezado con Logo Oficial de Banco Integral -->
      <div class="flex justify-end w-full">
        <img alt="Banco Integral Logo" class="h-12 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBHU2uBP0MvSaZCjcUUEa_KgWc2aARFDIcLJqcyW3SXNAIXN_A7nRK3z9SQre-ZOj_k7XftWgzSgToNfDaBBVbCgspJkNEF7ZyIakNDNVAureGxVUZFQTIIxpwqdZ0K44jNirZ3_mR2lIG7I1QgMlJDQ2HPwJ0qKn8sCEzOha3AT5Zls6T8EoJqTiWJredWGA4EymczctqMOiQ-4FzF5Ubxnejjs4JKIVgV2JcSv7ZFcuiteydNWXWbmrRNE-Od08g68yU">
      </div>

      <!-- Contenedor Central del Formulario -->
      <div class="flex-grow flex flex-col justify-center max-w-md w-full mx-auto my-auto">
        <div class="mb-lg text-center">
          <h2 class="font-headline-lg text-headline-lg text-primary mb-sm">Bienvenido de nuevo</h2>
          <p class="font-body-md text-body-md text-on-surface-variant">Ingresa a tu cuenta para gestionar tus viáticos.</p>
        </div>

        <!-- Vista Previa del Perfil Dinámico de Google -->
        <div class="flex flex-col items-center mb-lg min-h-[140px]">
          <div class="w-20 h-20 rounded-full border-2 border-outline-variant p-1 mb-sm relative bg-surface-container-high flex items-center justify-center">
            <span id="carga-foto" class="loader loader-blue absolute"></span>
            <img id="user-profile-img" class="w-full h-full rounded-full object-cover hidden" alt="Foto de perfil" src="">
            <div class="absolute bottom-0 right-0 w-4 h-4 bg-tertiary-fixed border-2 border-surface rounded-full z-10"></div>
          </div>
          <div class="text-center w-full">
            <span id="carga-texto" class="text-sm text-on-surface-variant animate-pulse block mt-2">Conectando con Google Workspace...</span>
            <span id="user-profile-name" class="font-headline-sm text-headline-sm text-primary block hidden"></span>
            <span id="user-profile-email" class="font-body-sm text-body-sm text-on-surface-variant block hidden"></span>
          </div>
        </div>

        <form class="space-y-md" onsubmit="event.preventDefault();">
          
          <!-- Caja de Error / Alertas -->
          <div id="caja-error" class="hidden p-3 bg-error-container text-on-error-container text-sm rounded border border-error/30 text-center font-medium"></div>

          <!-- Caja de Simulación Local (visible solo en pruebas locales) -->
          <div id="caja-simulador" class="p-3 bg-surface-container-low border border-outline-variant rounded mb-4 hidden">
            <label class="block text-xs font-bold text-primary mb-1">Entorno de Pruebas: Simular Perfil DB</label>
            <select id="simulador-acceso" class="w-full text-sm p-1.5 border border-outline-variant rounded bg-surface text-on-surface">
              <option value="ACCESO_SI_ADMIN">Usuario Administrador (Acceso Total)</option>
              <option value="ACCESO_SI_SOLICITANTE">Usuario Solicitante (Solo Solicitudes)</option>
              <option value="ACCESO_SI_EDITOR_COMPRAS">Usuario Editor Compras (Provisión y Cierre E1/E3)</option>
              <option value="ACCESO_SI_EDITOR_TESORERIA">Usuario Editor Tesorería (Procesamiento E2)</option>
              <option value="ACCESO_SI_AUTORIZADOR">Usuario Autorizador (Aprobaciones)</option>
              <option value="ACCESO_NO">Usuario SIN Permisos (Acceso NO)</option>
              <option value="NO_EXISTE">Usuario NO Registrado en DB</option>
            </select>
          </div>

          <!-- Botón de Ingreso al Portal -->
          <button id="btn-ingresar" onclick="procesarLogin()" disabled class="w-full bg-secondary-container hover:bg-secondary disabled:bg-outline-variant disabled:cursor-not-allowed text-on-secondary font-label-lg text-label-lg py-3 rounded-DEFAULT transition-colors shadow-sm flex items-center justify-center space-x-2 mt-lg cursor-pointer" type="button">
            <span id="btn-texto">Esperando datos de Google...</span>
            <span id="btn-icono" class="material-symbols-outlined hidden" style="font-variation-settings: 'wght' 600">arrow_forward</span>
            <span id="btn-cargando" class="loader hidden"></span>
          </button>
        </form>
      </div>

      <!-- Enlaces de Pie de Página -->
      <div class="flex justify-center space-x-md mt-lg font-body-sm text-body-sm text-on-surface-variant">
        <a class="hover:text-primary transition-colors" href="#">Soporte</a>
        <a class="hover:text-primary transition-colors" href="#">Política de Privacidad</a>
      </div>

    </div>
  </div>
</section>
