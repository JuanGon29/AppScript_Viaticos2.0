<script>
/**
 * =====================================================================
 * JS_E3.html - CONTROLADOR DE CIERRE DE SOLICITUDES EN COMPRAS (E3 & E3.1)
 * =====================================================================
 */

let e3_solicitudes = [];
let e3_filtradas = [];
let e3_page = 1;
let e3_page_size = 10;
let e3_sort_desc = true;
let e3_rango_fechas = { start: '', end: '' };
let e3_seleccionadas = new Set();
let e3_solicitud_actual = null;
let e3_comprobante_base64 = null;

/**
 * Carga las solicitudes en estado 'LIQUIDADO' para revisión y cierre en Compras.
 */
function cargarSolicitudesCierreE3() {
  const tbody = document.getElementById('tabla-e3-body');
  if (!tbody) return;

  tbody.innerHTML = `
    <tr>
      <td colspan="9" class="py-10 text-center align-middle bg-surface">
        <div class="flex items-center justify-center gap-2 text-primary font-medium text-sm">
          <span class="material-symbols-outlined animate-spin text-xl text-secondary-container">progress_activity</span>
          Cargando solicitudes pendientes de cierre y liquidación...
        </div>
      </td>
    </tr>
  `;

  e3_seleccionadas.clear();
  actualizarBotonAgruparE3();

  const correoUsuario = (window.DATOS_USUARIO && window.DATOS_USUARIO.CorreoGoogle) ? window.DATOS_USUARIO.CorreoGoogle : '';

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(resp) {
        if (resp && resp.status === 'OK') {
          e3_solicitudes = resp.solicitudes || [];
          filtrarTablaE3();
        } else {
          mostrarErrorTablaE3((resp && resp.mensaje) || 'No se pudieron cargar las solicitudes.');
        }
      })
      .withFailureHandler(function(err) {
        mostrarErrorTablaE3('Error de comunicación: ' + err.toString());
      })
      .obtenerSolicitudesCierreE3(correoUsuario);
  } else {
    // Mock local
    e3_solicitudes = [
      {
        idSolicitud: 'SOL-2026-0002',
        solicitante: 'Carlos Mendoza',
        correoSolicitante: 'carlos.mendoza@bancointegral.com.sv',
        monto: 220.00,
        montoFormatted: '$ 220.00',
        centroCosto: '406 - Compras y Provisiones',
        codigoCC: '406',
        fechaSolicitud: '14/08/2026 11:20',
        fechaModificacion: '15/08/2026 09:15',
        estadoSolicitud: 'LIQUIDADO',
        tipoViatico: 'Transporte',
        clasificacionSolicitud: 'Anticipo',
        tipoCierre: 'Reintegro y cierre',
        montoReintegro: '35.00',
        fechaReintegro: '15/08/2026',
        fechaCierreS: '15/08/2026 09:15',
        resolucionCierreE: 'Aprobado',
        comentarioCierreE: 'Facturas completas y depósito de reintegro verificado.',
        esAgrupable: true
      },
      {
        idSolicitud: 'SOL-2026-0007',
        solicitante: 'Beatriz Lemus',
        correoSolicitante: 'beatriz.lemus@bancointegral.com.sv',
        monto: 110.00,
        montoFormatted: '$ 110.00',
        centroCosto: '101 - Presidencia',
        codigoCC: '101',
        fechaSolicitud: '12/08/2026 10:00',
        fechaModificacion: '15/08/2026 11:30',
        estadoSolicitud: 'LIQUIDADO',
        tipoViatico: 'Alojamiento',
        clasificacionSolicitud: 'Anticipo',
        tipoCierre: 'Solo cierre',
        montoReintegro: '',
        fechaReintegro: '',
        fechaCierreS: '15/08/2026 11:30',
        resolucionCierreE: '',
        comentarioCierreE: '',
        esAgrupable: false
      }
    ];
    filtrarTablaE3();
  }
}

function mostrarErrorTablaE3(mensaje) {
  const tbody = document.getElementById('tabla-e3-body');
  if (!tbody) return;
  tbody.innerHTML = `
    <tr>
      <td colspan="9" class="py-8 text-center text-error bg-error-container/20 text-sm font-semibold">
        ${mensaje}
      </td>
    </tr>
  `;
}

/**
 * Filtra reactivamente la lista de cierre en compras.
 */
function filtrarTablaE3() {
  const filterId = (document.getElementById('filter-e3-id')?.value || '').toLowerCase().trim();
  const filterSol = (document.getElementById('filter-e3-solicitante')?.value || '').toLowerCase().trim();
  const filterType = (document.getElementById('filter-e3-type')?.value || '').toLowerCase().trim();
  const filterClassification = (document.getElementById('filter-e3-classification')?.value || '').toLowerCase().trim();
  const filterCC = (document.getElementById('filter-e3-cc')?.value || '').toLowerCase().trim();

  e3_filtradas = e3_solicitudes.filter(item => {
    if (filterId && !(item.idSolicitud || '').toLowerCase().includes(filterId)) return false;
    if (filterSol && !(item.solicitante || '').toLowerCase().includes(filterSol)) return false;
    if (filterType && !(item.tipoViatico || '').toLowerCase().includes(filterType)) return false;
    if (filterClassification && (item.clasificacionSolicitud || '').toLowerCase() !== filterClassification) return false;
    if (filterCC && !(item.codigoCC || '').toLowerCase().includes(filterCC)) return false;

    if (e3_rango_fechas.start || e3_rango_fechas.end) {
      const fechaItem = parseFechaE3(item.fechaSolicitud);
      if (fechaItem) {
        if (e3_rango_fechas.start) {
          const dtStart = new Date(e3_rango_fechas.start + 'T00:00:00');
          if (fechaItem < dtStart) return false;
        }
        if (e3_rango_fechas.end) {
          const dtEnd = new Date(e3_rango_fechas.end + 'T23:59:59');
          if (fechaItem > dtEnd) return false;
        }
      }
    }

    return true;
  });

  e3_filtradas.sort((a, b) => {
    const fA = parseFechaE3(a.fechaSolicitud) || new Date(0);
    const fB = parseFechaE3(b.fechaSolicitud) || new Date(0);
    return e3_sort_desc ? (fB - fA) : (fA - fB);
  });

  e3_page = 1;
  renderTablaE3();
}

function formatearFechaE3(fechaStr) {
  if (!fechaStr) return '-';
  const str = fechaStr.toString().trim();
  if (str.includes('/')) {
    const parts = str.split(' ')[0].split('/');
    if (parts.length === 3) {
      const d = parts[0].padStart(2, '0');
      const m = parts[1].padStart(2, '0');
      const y = parts[2].length === 2 ? ('20' + parts[2]) : parts[2];
      return `${d}/${m}/${y}`;
    }
  }
  const dt = new Date(str);
  if (!isNaN(dt.getTime())) {
    const d = String(dt.getDate()).padStart(2, '0');
    const m = String(dt.getMonth() + 1).padStart(2, '0');
    const y = dt.getFullYear();
    return `${d}/${m}/${y}`;
  }
  return str;
}

function parseFechaE3(str) {
  if (!str) return null;
  if (str.includes('/')) {
    const parts = str.split(' ')[0].split('/');
    if (parts.length === 3) {
      return new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
    }
  }
  const d = new Date(str);
  return isNaN(d.getTime()) ? null : d;
}

/**
 * Renderiza filas en el DOM para E3.
 */
function renderTablaE3() {
  const tbody = document.getElementById('tabla-e3-body');
  const noResults = document.getElementById('e3-no-results-row');
  const countLabel = document.getElementById('e3-solicitudes-count');
  const paginationControls = document.getElementById('e3-pagination-controls');

  if (!tbody) return;

  if (e3_filtradas.length === 0) {
    tbody.innerHTML = '';
    noResults?.classList.remove('hidden');
    if (countLabel) countLabel.textContent = 'Mostrando 0 de 0 solicitudes';
    if (paginationControls) paginationControls.innerHTML = '';
    return;
  }

  noResults?.classList.add('hidden');

  const total = e3_filtradas.length;
  const totalPages = Math.ceil(total / e3_page_size) || 1;
  if (e3_page > totalPages) e3_page = totalPages;

  const startIdx = (e3_page - 1) * e3_page_size;
  const endIdx = Math.min(startIdx + e3_page_size, total);
  const itemsPagina = e3_filtradas.slice(startIdx, endIdx);

  if (countLabel) {
    countLabel.textContent = `Mostrando ${startIdx + 1}-${endIdx} de ${total} solicitudes`;
  }

  tbody.innerHTML = itemsPagina.map(item => {
    const badgeEstado = '<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-cyan-100 text-cyan-800 border border-cyan-200"><span class="w-1.5 h-1.5 rounded-full bg-cyan-600"></span>LIQUIDADO</span>';

    const badgeClasif = item.clasificacionSolicitud === 'Reintegro'
      ? '<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-purple-100 text-purple-800">Reintegro</span>'
      : '<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-blue-100 text-blue-800">Anticipo</span>';

    const isChecked = e3_seleccionadas.has(item.idSolicitud);
    const checkboxHtml = item.esAgrupable
      ? `<input type="checkbox" class="w-4 h-4 rounded border-outline-variant text-secondary-container focus:ring-secondary-container cursor-pointer" onchange="toggleSelectSolicitudE3('${item.idSolicitud}', this.checked)" ${isChecked ? 'checked' : ''} title="Seleccionar para asentar reintegro contable">`
      : `<span class="w-4 h-4 inline-block" title="Solo habilitado para solicitudes aprobadas con Reintegro y cierre"></span>`;

    const fechaSolFmt = formatearFechaE3(item.fechaSolicitud);
    const fechaModFmt = formatearFechaE3(item.fechaModificacion);

    return `
      <tr class="hover:bg-surface-container-low transition-colors ${isChecked ? 'bg-secondary-container/5' : ''}">
        <td class="py-3 px-3 text-center font-bold text-primary text-xs align-middle">
          ${item.idSolicitud}
        </td>
        <td class="py-3 px-3 text-center text-xs font-medium text-on-surface align-middle">
          ${item.solicitante}
        </td>
        <td class="py-3 px-3 text-center text-xs font-bold text-primary align-middle">
          ${item.montoFormatted || ('$ ' + parseFloat(item.monto || 0).toFixed(2))}
        </td>
        <td class="py-3 px-3 text-center text-xs font-bold text-on-surface-variant align-middle">
          <span class="bg-surface-container px-2 py-0.5 rounded font-mono text-[11px]">${item.codigoCC || '-'}</span>
        </td>
        <td class="py-3 px-3 text-center text-xs text-on-surface-variant align-middle">
          <div class="font-medium text-on-surface">${fechaSolFmt}</div>
          ${fechaModFmt && fechaModFmt !== fechaSolFmt && fechaModFmt !== '-' ? `<div class="text-[10px] text-outline">Mod: ${fechaModFmt}</div>` : ''}
        </td>
        <td class="py-3 px-3 text-center align-middle">
          ${badgeEstado}
        </td>
        <td class="py-3 px-3 text-center text-xs font-medium text-on-surface align-middle">
          ${item.tipoViatico}
        </td>
        <td class="py-3 px-3 text-center align-middle">
          ${badgeClasif}
        </td>
        <td class="py-3 px-3 text-center align-middle">
          <div class="flex items-center justify-center gap-2">
            ${checkboxHtml}
            <button onclick="verDetalleCierreE3('${item.idSolicitud}')" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-primary-container text-on-primary hover:bg-primary text-xs font-bold transition-colors cursor-pointer shadow-xs">
              <span class="material-symbols-outlined text-sm">visibility</span>
              Ver detalles
            </button>
          </div>
        </td>
      </tr>
    `;
  }).join('');

  renderPaginacionE3(totalPages);
}

function toggleSelectE3(id, checked) {
  toggleSelectSolicitudE3(id, checked);
}

function toggleSelectSolicitudE3(id, checked) {
  if (checked) {
    e3_seleccionadas.add(id);
  } else {
    e3_seleccionadas.delete(id);
  }
  actualizarBotonAgruparE3();
  renderTablaE3();
}

function actualizarBotonAgruparE3() {
  const btn = document.getElementById('btn-e3-agrupar');
  const countSpan = document.getElementById('e3-selected-count');
  const count = e3_seleccionadas.size;

  if (countSpan) countSpan.textContent = count;
  if (btn) {
    btn.disabled = (count === 0);
  }
}

function renderPaginacionE3(totalPages) {
  const container = document.getElementById('e3-pagination-controls');
  if (!container) return;

  let html = '';
  html += `
    <button onclick="cambiarPaginaE3(${e3_page - 1})" ${e3_page === 1 ? 'disabled' : ''} class="px-3 py-1 border border-outline-variant rounded text-xs font-medium hover:bg-surface-container transition-colors disabled:opacity-40 disabled:pointer-events-none cursor-pointer">
      Anterior
    </button>
  `;

  for (let p = 1; p <= totalPages; p++) {
    if (totalPages > 6 && Math.abs(p - e3_page) > 2 && p !== 1 && p !== totalPages) {
      if (p === 2 || p === totalPages - 1) html += `<span class="px-1 text-xs text-outline">...</span>`;
      continue;
    }
    const isActive = (p === e3_page);
    html += `
      <button onclick="cambiarPaginaE3(${p})" class="px-3 py-1 border ${isActive ? 'bg-primary-container text-on-primary border-primary-container font-bold' : 'border-outline-variant hover:bg-surface-container text-on-surface'} rounded text-xs transition-colors cursor-pointer">
        ${p}
      </button>
    `;
  }

  html += `
    <button onclick="cambiarPaginaE3(${e3_page + 1})" ${e3_page === totalPages ? 'disabled' : ''} class="px-3 py-1 border border-outline-variant rounded text-xs font-medium hover:bg-surface-container transition-colors disabled:opacity-40 disabled:pointer-events-none cursor-pointer">
      Siguiente
    </button>
  `;

  container.innerHTML = html;
}

function cambiarPaginaE3(p) {
  e3_page = p;
  renderTablaE3();
}

function cambiarPageSizeE3(size) {
  e3_page_size = parseInt(size) || 10;
  e3_page = 1;
  renderTablaE3();
}

function toggleSortDateE3() {
  e3_sort_desc = !e3_sort_desc;
  const icon = document.getElementById('sort-icon-e3');
  if (icon) icon.textContent = e3_sort_desc ? 'arrow_downward' : 'arrow_upward';
  filtrarTablaE3();
}

function limpiarFiltrosE3() {
  const fields = ['filter-e3-id', 'filter-e3-solicitante', 'filter-e3-type', 'filter-e3-classification', 'filter-e3-cc', 'filter-e3-date'];
  fields.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  limpiarRangoFechasE3();
}

function toggleDateDropdownE3() {
  const dropdown = document.getElementById('filter-e3-date-dropdown');
  dropdown?.classList.toggle('hidden');
}

function aplicarRangoFechasE3() {
  const start = document.getElementById('filter-e3-date-start')?.value;
  const end = document.getElementById('filter-e3-date-end')?.value;
  const textInput = document.getElementById('filter-e3-date');

  e3_rango_fechas = { start: start || '', end: end || '' };

  if (start && end) {
    textInput.value = `${start} - ${end}`;
  } else if (start) {
    textInput.value = `>= ${start}`;
  } else if (end) {
    textInput.value = `<= ${end}`;
  } else {
    textInput.value = '';
  }

  document.getElementById('filter-e3-date-dropdown')?.classList.add('hidden');
  filtrarTablaE3();
}

function limpiarRangoFechasE3() {
  const start = document.getElementById('filter-e3-date-start');
  const end = document.getElementById('filter-e3-date-end');
  const textInput = document.getElementById('filter-e3-date');

  if (start) start.value = '';
  if (end) end.value = '';
  if (textInput) textInput.value = '';

  e3_rango_fechas = { start: '', end: '' };
  document.getElementById('filter-e3-date-dropdown')?.classList.add('hidden');
  filtrarTablaE3();
}

// ---------------------------------------------------------------------
// MODAL DE AGRUPACIÓN DE CIERRE (E3)
// ---------------------------------------------------------------------

function abrirModalAgruparE3() {
  if (e3_seleccionadas.size === 0) return;

  const countSpan = document.getElementById('modal-e3-count');
  const montoSpan = document.getElementById('modal-e3-monto-total');
  const listaContainer = document.getElementById('modal-e3-lista-ids');
  const errBox = document.getElementById('e3-asiento-error');

  errBox?.classList.add('hidden');
  e3_comprobante_base64 = null;
  document.getElementById('form-e3-asiento')?.reset();

  const hoyISO = new Date().toISOString().split('T')[0];
  const inputContable = document.getElementById('e3-asiento-fecha-contable');
  const inputValor = document.getElementById('e3-asiento-fecha-valor');
  if (inputContable) inputContable.value = hoyISO;
  if (inputValor) inputValor.value = hoyISO;

  let totalMonto = 0;
  const idsArr = Array.from(e3_seleccionadas);
  
  if (listaContainer) {
    listaContainer.innerHTML = idsArr.map(id => {
      const item = e3_solicitudes.find(s => s.idSolicitud === id);
      if (item) totalMonto += parseFloat(item.monto || 0);
      return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-bold bg-primary text-on-primary font-mono">${id}</span>`;
    }).join('');
  }

  if (countSpan) countSpan.textContent = idsArr.length;
  if (montoSpan) montoSpan.textContent = '$ ' + totalMonto.toFixed(2) + ' USD';

  document.getElementById('e3-modal-agrupar')?.classList.remove('hidden');
}

function cerrarModalAgruparE3() {
  document.getElementById('e3-modal-agrupar')?.classList.add('hidden');
}

function handleFileAsientoE3(input) {
  const file = input.files?.[0];
  if (!file) {
    e3_comprobante_base64 = null;
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    e3_comprobante_base64 = {
      NombreArchivo: file.name,
      TipoArchivo: file.type || 'application/pdf',
      ContenidoBase64: e.target.result
    };
  };
  reader.readAsDataURL(file);
}

function confirmarGuardarAgrupacionE3() {
  const btn = document.getElementById('btn-modal-guardar-e3');
  const errBox = document.getElementById('e3-asiento-error');

  const fContableRaw = document.getElementById('e3-asiento-fecha-contable')?.value;
  const fValorRaw = document.getElementById('e3-asiento-fecha-valor')?.value;
  const modulo = (document.getElementById('e3-asiento-modulo')?.value || '').trim();
  const transaccion = (document.getElementById('e3-asiento-transaccion')?.value || '').trim();
  const codigoRelacion = (document.getElementById('e3-asiento-relacion')?.value || document.getElementById('e3-asiento-codigo-relacion')?.value || '').trim();
  const crFse = (document.getElementById('e3-asiento-cr-fse')?.value || '').trim();

  if (!fContableRaw || !fValorRaw || !modulo || !transaccion || !codigoRelacion) {
    if (errBox) {
      errBox.textContent = 'Por favor complete todos los campos obligatorios (*).';
      errBox.classList.remove('hidden');
    }
    return;
  }

  if (!e3_comprobante_base64) {
    if (errBox) {
      errBox.textContent = 'Debe adjuntar el comprobante contable del reintegro.';
      errBox.classList.remove('hidden');
    }
    return;
  }

  const cParts = fContableRaw.split('-');
  const fContable = `${cParts[2]}/${cParts[1]}/${cParts[0]}`;
  const vParts = fValorRaw.split('-');
  const fValor = `${vParts[2]}/${vParts[1]}/${vParts[0]}`;

  const datosAsiento = {
    fechaContable: fContable,
    fechaValor: fValor,
    modulo: modulo,
    transaccion: transaccion,
    codigoRelacion: codigoRelacion,
    crFse: crFse
  };

  const idsArr = Array.from(e3_seleccionadas);
  const nombreUsuario = (window.DATOS_USUARIO && window.DATOS_USUARIO.NombreGoogle) ? window.DATOS_USUARIO.NombreGoogle : 'Editor Compras';

  btn.disabled = true;
  btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-sm">progress_activity</span> Guardando asiento...`;

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(resp) {
        btn.disabled = false;
        btn.innerHTML = `<span class="material-symbols-outlined text-sm">save</span> Guardar Agrupación`;
        cerrarModalAgruparE3();

        if (resp && resp.status === 'OK') {
          alert(resp.mensaje || 'Lote de reintegros asentado y finalizado exitosamente.');
          e3_seleccionadas.clear();
          cargarSolicitudesCierreE3();
        } else {
          alert('Error: ' + ((resp && resp.mensaje) || 'No se pudo guardar la agrupación.'));
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.innerHTML = `<span class="material-symbols-outlined text-sm">save</span> Guardar Agrupación`;
        alert('Error de servidor: ' + err.toString());
      })
      .guardarAgrupacionCierreE3(idsArr, datosAsiento, e3_comprobante_base64, nombreUsuario);
  } else {
    setTimeout(() => {
      btn.disabled = false;
      btn.innerHTML = `<span class="material-symbols-outlined text-sm">save</span> Guardar Agrupación`;
      cerrarModalAgruparE3();
      
      // Mutar solicitudes a FINALIZADO en array local
      idsArr.forEach(id => {
        const item = e3_solicitudes.find(s => s.idSolicitud === id);
        if (item) {
          item.estadoSolicitud = 'FINALIZADO';
          item.actorActual = '';
        }
      });

      alert(`Asiento de reintegro simulado de ${idsArr.length} solicitud(es) completado. Las solicitudes pasaron a estado FINALIZADO.`);
      e3_seleccionadas.clear();
      actualizarBotonAgruparE3();
      filtrarTablaE3();
    }, 800);
  }
}

// ---------------------------------------------------------------------
// DETALLE Y RESOLUCIÓN DE CIERRE (E3.1)
// ---------------------------------------------------------------------

function verDetalleCierreE3(idSolicitud) {
  mostrarSubvista('view-e3-1-detalle', `Revisión Cierre - ${idSolicitud}`);

  document.getElementById('e3-1-id-badge').textContent = idSolicitud;
  document.getElementById('e3-1-status-badge').innerHTML = '<span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-bold bg-cyan-100 text-cyan-800 border border-cyan-200"><span class="w-1.5 h-1.5 rounded-full bg-cyan-600"></span>LIQUIDADO</span>';
  
  // Ocultar sección responder por defecto
  document.getElementById('e3-1-seccion-responder')?.classList.add('hidden');
  document.getElementById('e3-1-btn-responder')?.classList.remove('hidden');
  document.getElementById('e3-1-btn-imprimir')?.classList.remove('hidden');
  document.getElementById('e3-1-btn-guardar')?.classList.add('hidden');
  document.getElementById('e3-1-resolucion-select').value = '';
  document.getElementById('e3-1-comentario-input').value = '';
  document.getElementById('e3-1-comentario-error')?.classList.add('hidden');
  document.getElementById('e3-1-comentario-required')?.classList.add('hidden');

function poblarFormularioE3_1(det) {
  e3_solicitud_actual = det;

  const idBadge = document.getElementById('e3-1-id-badge');
  if (idBadge) idBadge.textContent = det.idSolicitud || '';

  // Bloque 1: Solicitante (Inputs limpios)
  const setVal = (id, v) => {
    const el = document.getElementById(id);
    if (el) el.value = v || '';
  };
  const setText = (id, v) => {
    const el = document.getElementById(id);
    if (el) el.textContent = v || '-';
  };

  setVal('e3-1-sol-nombre', det.nombreSolicitante);
  setVal('e3-1-sol-correo', det.correoSolicitante);
  setVal('e3-1-sol-cargo', det.cargoSolicitante);
  setVal('e3-1-sol-gerencia', det.gerencia);
  setVal('e3-1-sol-cc', det.centroCosto);
  setVal('e3-1-sol-agencia', det.agencia);

  // Bloque 2: Detalle Viático (Spans de texto)
  setText('e3-1-viatico-duracion', det.duracionActividad || 'Día único');
  setText('e3-1-viatico-fecha-ini', formatearFechaE3(det.fechaInicio));
  setText('e3-1-viatico-fecha-fin', formatearFechaE3(det.fechaFin || det.fechaInicio));
  setText('e3-1-viatico-tipo', det.tipoViatico);
  
  const horaCont = document.getElementById('e3-1-hora-container');
  if (det.horaEvento) {
    horaCont?.classList.remove('hidden');
    setText('e3-1-viatico-hora', det.horaEvento);
  } else {
    horaCont?.classList.add('hidden');
  }

  setText('e3-1-viatico-tipo-sol', det.tipoSolicitud || 'Personal');
  setText('e3-1-viatico-destinatario', det.destinatario || det.nombreSolicitante);
  setText('e3-1-viatico-monto', det.montoFormatted || ('$ ' + parseFloat(det.monto || 0).toFixed(2)));
  setText('e3-1-viatico-clasificacion', det.clasificacionSolicitud || 'Anticipo');
  setText('e3-1-motivo', det.motivoViatico || '-');

  // Tabla Bancaria
  setText('e3-1-tb-destinatario', det.destinatario || det.nombreSolicitante);
  setText('e3-1-tb-monto', det.montoFormatted || ('$ ' + parseFloat(det.monto || 0).toFixed(2)));
  setText('e3-1-banco', det.banco || '-');
  setText('e3-1-tipo-cuenta', det.tipoCuenta || '-');
  setText('e3-1-num-cuenta', det.numeroCuenta || '-');

  const esEdit = (det.esEditado === 'Si' || det.esEditado === 'SI' || det.es_editado === 'Si');
  const badgeEdit = document.getElementById('e3-1-es-editado-badge');
  if (badgeEdit) {
    if (esEdit) {
      badgeEdit.className = 'px-2.5 py-0.5 rounded-full text-xs font-extrabold bg-amber-100 text-amber-900 border border-amber-300 inline-flex items-center gap-1';
      badgeEdit.innerHTML = '<span class="material-symbols-outlined text-xs text-amber-700">warning</span> Modificado manualmente';
    } else {
      badgeEdit.className = 'px-2.5 py-0.5 rounded-full text-xs font-semibold bg-gray-100 text-gray-700 border border-gray-300';
      badgeEdit.textContent = 'Normal';
    }
  }

  // Bloque 3: Información Solicitud & Liquidación Solicitante (Métricas en 4 columnas)
  setText('e3-1-info-id', det.idSolicitud || '');
  setText('e3-1-info-monto', det.montoFormatted || ('$ ' + parseFloat(det.monto || 0).toFixed(2)));
  setText('e3-1-info-fecha-creacion', formatearFechaE3(det.fechaSolicitud));
  setText('e3-1-info-rubro', det.rubroContable || '8110050400000 - Viáticos y Movilidad');
  setText('e3-1-info-clasificacion', det.clasificacionSolicitud || 'Anticipo');
  setText('e3-1-info-tipo-cierre', det.tipoCierre || 'Solo cierre');
  setText('e3-1-info-monto-reintegro', det.montoReintegro ? ('$ ' + parseFloat(det.montoReintegro).toFixed(2)) : '$ 0.00');
  setText('e3-1-info-fecha-reintegro', formatearFechaE3(det.fechaReintegro));
  setText('e3-1-info-fecha-cierre-s', formatearFechaE3(det.fechaCierreS));

  // Archivos Adjuntos con fa-paperclip
  const listaArch = document.getElementById('e3-1-archivos-lista');
  if (listaArch) {
    if (det.archivosAdjuntos && det.archivosAdjuntos.length > 0) {
      listaArch.innerHTML = det.archivosAdjuntos.map(arch => `
        <a href="${arch.LinkArchivo || '#'}" target="_blank" class="flex items-center gap-2 p-2.5 rounded-lg border border-outline-variant bg-surface-container-lowest hover:bg-surface-container transition-colors shadow-xs">
          <i class="fas fa-paperclip text-primary text-base"></i>
          <span class="text-xs font-semibold text-primary truncate flex-1">${arch.NombreArchivo || 'Archivo adjunto'}</span>
          <span class="material-symbols-outlined text-xs text-outline">open_in_new</span>
        </a>
      `).join('');
    } else {
      listaArch.innerHTML = '<span class="text-xs text-outline italic">No hay archivos adjuntos.</span>';
    }
  }

  // Bloque 4: Tabla Autorizaciones
  const tablaAut = document.getElementById('e3-1-tabla-autorizaciones');
  if (tablaAut) {
    if (det.datosAutorizacion && det.datosAutorizacion.length > 0) {
      tablaAut.innerHTML = det.datosAutorizacion.map(aut => `
        <tr class="hover:bg-surface-container-low transition-colors">
          <td class="py-2.5 px-4 text-center font-semibold text-primary">${aut.nombre || ('Nivel ' + aut.nivel)}</td>
          <td class="py-2.5 px-4 text-center text-on-surface-variant">${formatearFechaE3(aut.fecha)}</td>
          <td class="py-2.5 px-4 text-center">
            <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-bold ${aut.resolucion === 'APROBADO' ? 'bg-emerald-100 text-emerald-800' : aut.resolucion === 'JUSTIFICADO' ? 'bg-blue-100 text-blue-800' : 'bg-gray-100 text-gray-800'}">
              ${aut.resolucion || 'REGISTRADO'}
            </span>
          </td>
          <td class="py-2.5 px-4 text-left text-on-surface leading-relaxed">${aut.comentario || '-'}</td>
        </tr>
      `).join('');
    } else {
      tablaAut.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-outline italic">Sin registros de autorización previa.</td></tr>`;
    }
  }

  // Bloque 5: Tabla Provisión Compras
  setText('e3-1-prov-nombre', det.nombreProvision || 'Compras');
  setText('e3-1-prov-fecha', formatearFechaE3(det.fechaProvision));
  setText('e3-1-prov-comentario', det.comentarioProvision || 'Provisión contable aprobada.');

  // Bloque 6: Tabla Procesamiento Tesorería
  setText('e3-1-proc-nombre', det.nombreProcesamiento || 'Tesorería');
  setText('e3-1-proc-fecha', formatearFechaE3(det.fechaProcesamiento));
  setText('e3-1-proc-comentario', det.comentarioProcesamiento || 'Desembolso bancario ejecutado.');

  // Pre-llenar valores previos de resolución
  if (det.resolucionCierreE) {
    document.getElementById('e3-1-resolucion-select').value = det.resolucionCierreE;
    document.getElementById('e3-1-comentario-input').value = det.comentarioCierreE || '';
    handleCambioResolucionE3_1(det.resolucionCierreE);
  }
}

function activarSeccionResponderE3_1() {
  document.getElementById('e3-1-seccion-responder')?.classList.remove('hidden');
  document.getElementById('e3-1-btn-responder')?.classList.add('hidden');
  document.getElementById('e3-1-btn-imprimir')?.classList.add('hidden');
  document.getElementById('e3-1-btn-guardar')?.classList.remove('hidden');
  document.getElementById('e3-1-resolucion-select')?.focus();
}

function handleCambioResolucionE3_1(val) {
  const reqSpan = document.getElementById('e3-1-comentario-asterisco') || document.getElementById('e3-1-comentario-required');
  if (val === 'Rechazado') {
    reqSpan?.classList.remove('hidden');
  } else {
    reqSpan?.classList.add('hidden');
  }
}

function abrirModalConfirmarE3_1() {
  abrirModalConfirmarResolucionE3_1();
}

function abrirModalConfirmarResolucionE3_1() {
  const resolucion = document.getElementById('e3-1-resolucion-select')?.value;
  const comentario = (document.getElementById('e3-1-comentario-input')?.value || '').trim();

  if (!resolucion) {
    alert('Debe seleccionar una resolución de cierre.');
    document.getElementById('e3-1-resolucion-select')?.focus();
    return;
  }

  if (resolucion === 'Rechazado' && !comentario) {
    alert('El comentario es obligatorio cuando se rechaza la liquidación.');
    document.getElementById('e3-1-comentario-input')?.focus();
    return;
  }

  const modalTxt = document.getElementById('e3-1-modal-confirmar-text');
  if (modalTxt) {
    modalTxt.innerHTML = `¿Está seguro que desea dictaminar la liquidación como <b>${resolucion}</b> para la solicitud <b>${e3_solicitud_actual?.idSolicitud}</b>?`;
  }

  document.getElementById('e3-1-modal-confirmar')?.classList.remove('hidden');
}

function cerrarModalConfirmarE3_1() {
  cerrarModalConfirmarResolucionE3_1();
}

function cerrarModalConfirmarResolucionE3_1() {
  document.getElementById('e3-1-modal-confirmar')?.classList.add('hidden');
}

function confirmarGuardarResolucionE3_1() {
  const btn = document.getElementById('e3-1-btn-modal-ejecutar');
  const idSolicitud = e3_solicitud_actual?.idSolicitud;
  const resolucion = document.getElementById('e3-1-resolucion-select')?.value;
  const comentario = (document.getElementById('e3-1-comentario-input')?.value || '').trim();
  const nombreUsuario = (window.DATOS_USUARIO && window.DATOS_USUARIO.NombreGoogle) ? window.DATOS_USUARIO.NombreGoogle : 'Editor Compras';

  if (!idSolicitud || !resolucion) return;

  btn.disabled = true;
  btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-sm">progress_activity</span> Guardando...`;

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(resp) {
        btn.disabled = false;
        btn.innerHTML = `<span class="material-symbols-outlined text-sm">check</span> Confirmar y Guardar`;
        cerrarModalConfirmarResolucionE3_1();

        if (resp && resp.status === 'OK') {
          mostrarAlertaE3_1(resp.mensaje || 'Dictamen de liquidación registrado exitosamente.', 'success');
          setTimeout(() => {
            navegarSubmenu('view-e3-cierre');
            cargarSolicitudesCierreE3();
          }, 1800);
        } else {
          mostrarAlertaE3_1((resp && resp.mensaje) || 'Error al guardar dictamen.', 'error');
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.innerHTML = `<span class="material-symbols-outlined text-sm">check</span> Confirmar y Guardar`;
        cerrarModalConfirmarResolucionE3_1();
        mostrarAlertaE3_1('Error de servidor: ' + err.toString(), 'error');
      })
      .guardarResolucionCierreE3_1(idSolicitud, resolucion, comentario, nombreUsuario);
  } else {
    setTimeout(() => {
      btn.disabled = false;
      btn.innerHTML = `<span class="material-symbols-outlined text-sm">check</span> Confirmar y Guardar`;
      cerrarModalConfirmarResolucionE3_1();

      // Mutación de estado local
      const item = e3_solicitudes.find(s => s.idSolicitud === idSolicitud);
      if (item) {
        item.resolucionCierreE = resolucion;
        item.comentarioCierreE = comentario;

        if (resolucion === 'Aprobado') {
          if (item.tipoCierre === 'Solo cierre') {
            item.estadoSolicitud = 'FINALIZADO';
            item.actorActual = '';
          } else if (item.tipoCierre === 'Reintegro y cierre') {
            item.estadoSolicitud = 'LIQUIDADO';
            item.esAgrupable = true;
          }
        } else if (resolucion === 'Rechazado') {
          item.estadoSolicitud = 'RECHAZO-CIERRE';
          item.actorActual = 'Solicitante';
        }
      }

      mostrarAlertaE3_1('Dictamen de liquidación guardado exitosamente (Modo Local).', 'success');
      setTimeout(() => {
        navegarSubmenu('view-e3-cierre');
        filtrarTablaE3();
      }, 1200);
    }, 700);
  }
}

function mostrarAlertaE3_1(mensaje, tipo) {
  const box = document.getElementById('e3-1-alert-box');
  const txt = document.getElementById('e3-1-alert-text');
  if (!box || !txt) return;

  txt.textContent = mensaje;
  box.classList.remove('hidden', 'bg-emerald-600', 'bg-error');

  if (tipo === 'success') {
    box.classList.add('bg-emerald-600');
  } else {
    box.classList.add('bg-error');
  }

  box.style.display = 'block';
  setTimeout(() => {
    box.style.display = 'none';
  }, 4000);
}
