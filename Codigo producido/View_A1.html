<!-- ===================================================================== -->
<!-- SUB-VISTA: View_A1.html (BANDEJA DE AUTORIZACIÓN DE SOLICITUDES - A1) -->
<!-- ===================================================================== -->
<div id="view-a1-autorizaciones" class="vista-oculta flex flex-col gap-lg w-full max-w-7xl mx-auto py-4 px-2 md:px-6">

  <!-- Encabezado de Página -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b pb-4 border-outline-variant">
    <div>
      <h2 class="font-headline-lg text-2xl md:text-3xl font-extrabold text-primary mb-1">Autorizacion de Solicitudes</h2>
      <p class="font-body-md text-sm text-on-surface-variant">Revise y autorize las solicitudes de viáticos activas.</p>
    </div>

    <!-- Botón de Recarga Rápida -->
    <button onclick="cargarSolicitudesAutorizacionA1()" class="btn-action bg-surface hover:bg-surface-container text-primary border border-outline-variant px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-xs flex items-center gap-2 cursor-pointer self-start md:self-auto">
      <i class="fas fa-sync-alt text-secondary"></i>
      <span>Actualizar Bandeja</span>
    </button>
  </div>

  <!-- Barra de Filtros (Filter Bar con 5 Criterios de Referencia) -->
  <div class="bg-surface border border-outline-variant rounded-lg p-md mb-lg shadow-sm">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 items-end">
      
      <!-- 1. ID Solicitud -->
      <div class="flex flex-col">
        <label class="font-label-md text-xs text-on-surface-variant mb-1 uppercase font-bold" for="filter-a1-id">ID Solicitud</label>
        <input class="w-full h-10 px-3 border border-outline-variant rounded bg-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none font-body-sm text-xs text-on-surface transition-colors" id="filter-a1-id" oninput="filtrarTablaA1()" placeholder="Ej: SOL-2026-0001" type="text">
      </div>

      <!-- 2. Fechas -->
      <div class="flex flex-col">
        <label class="font-label-md text-xs text-on-surface-variant mb-1 uppercase font-bold" for="filter-a1-date">Fechas</label>
        <input class="w-full h-10 px-3 border border-outline-variant rounded bg-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none font-body-sm text-xs text-on-surface transition-colors" id="filter-a1-date" onchange="filtrarTablaA1()" type="date">
      </div>

      <!-- 3. Solicitante -->
      <div class="flex flex-col">
        <label class="font-label-md text-xs text-on-surface-variant mb-1 uppercase font-bold" for="filter-a1-applicant">Solicitante</label>
        <input class="w-full h-10 px-3 border border-outline-variant rounded bg-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none font-body-sm text-xs text-on-surface transition-colors" id="filter-a1-applicant" oninput="filtrarTablaA1()" placeholder="Nombre del solicitante" type="text">
      </div>

      <!-- 4. Actor Actual -->
      <div class="flex flex-col">
        <label class="font-label-md text-xs text-on-surface-variant mb-1 uppercase font-bold" for="filter-a1-actor">Actor Actual</label>
        <input class="w-full h-10 px-3 border border-outline-variant rounded bg-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none font-body-sm text-xs text-on-surface transition-colors" id="filter-a1-actor" oninput="filtrarTablaA1()" placeholder="Responsable actual" type="text">
      </div>

      <!-- 5. Clasificación Solicitud -->
      <div class="flex flex-col">
        <label class="font-label-md text-xs text-on-surface-variant mb-1 uppercase font-bold" for="filter-a1-classification">Clasificación Solicitud</label>
        <select class="w-full h-10 px-3 border border-outline-variant rounded bg-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none font-body-sm text-xs text-on-surface transition-colors" id="filter-a1-classification" onchange="filtrarTablaA1()">
          <option value="">Todos los tipos</option>
          <option value="Anticipo">Anticipo</option>
          <option value="Reintegro">Reintegro</option>
        </select>
      </div>

      <!-- Botón Limpiar y Paginación Size -->
      <div class="flex items-center gap-2">
        <div class="flex-1 flex flex-col">
          <label class="font-label-md text-xs text-on-surface-variant mb-1 uppercase font-bold" for="filter-a1-pagesize">Mostrar</label>
          <select id="filter-a1-pagesize" onchange="cambiarPageSizeA1(this.value)" class="w-full h-10 px-2 border border-outline-variant rounded bg-surface text-xs text-on-surface outline-none">
            <option value="10">10 filas</option>
            <option value="20">20 filas</option>
            <option value="30">30 filas</option>
          </select>
        </div>
        <button onclick="limpiarFiltrosA1()" title="Limpiar filtros" class="h-10 px-3 mt-auto rounded border border-outline-variant hover:bg-surface-container text-on-surface transition-colors cursor-pointer flex items-center justify-center">
          <i class="fas fa-filter-circle-xmark text-sm"></i>
        </button>
      </div>

    </div>
  </div>

  <!-- Contenedor de la Tabla de Datos (9 Columnas Oficiales de Referencia) -->
  <div class="bg-surface border border-outline-variant rounded-lg overflow-hidden shadow-sm">
    <div class="overflow-x-auto w-full">
      <table class="w-full text-left border-collapse min-w-[950px]">
        <thead class="bg-primary border-b border-outline-variant text-on-primary">
          <tr>
            <th class="py-sm px-md font-label-md text-label-md text-on-primary uppercase font-bold text-xs">ID Solicitud</th>
            <th class="py-sm px-md font-label-md text-label-md text-on-primary uppercase font-bold text-xs cursor-pointer select-none" onclick="toggleSortDateA1()">
              <div class="flex items-center gap-1.5">
                <span>Fechas</span>
                <i id="a1-sort-icon" class="fas fa-arrow-down text-[10px]"></i>
              </div>
            </th>
            <th class="py-sm px-md font-label-md text-label-md text-on-primary uppercase font-bold text-xs">Solicitante</th>
            <th class="py-sm px-md font-label-md text-label-md text-on-primary uppercase font-bold text-xs">Destinatarios</th>
            <th class="py-sm px-md font-label-md text-label-md text-on-primary uppercase font-bold text-xs text-right">Montos</th>
            <th class="py-sm px-md font-label-md text-label-md text-on-primary uppercase font-bold text-xs text-center">Estado Solicitud</th>
            <th class="py-sm px-md font-label-md text-label-md text-on-primary uppercase font-bold text-xs">Actor Actual</th>
            <th class="py-sm px-md font-label-md text-label-md text-on-primary uppercase font-bold text-xs">Clasificación Solicitud</th>
            <th class="py-sm px-md font-label-md text-label-md text-on-primary uppercase font-bold text-xs text-center">Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-a1-body" class="divide-y divide-outline-variant text-xs">
          <!-- Renderizado dinámico desde JS_A1.html -->
        </tbody>
      </table>
    </div>

    <!-- Paginador Footer -->
    <div class="p-4 border-t border-outline-variant bg-surface flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-on-surface-variant">
      <span id="a1-pagination-info">Mostrando 0 de 0 solicitudes</span>
      <div id="a1-pagination-controls" class="flex items-center gap-1">
        <!-- Botones de página dinámicos -->
      </div>
    </div>
  </div>

</div>
