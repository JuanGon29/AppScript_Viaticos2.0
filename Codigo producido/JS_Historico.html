/**
 * Filtra y ordena las solicitudes históricas.
 */
function filtrarTablaHistorico() {
  const q = (document.getElementById('filter-hist-search')?.value || '').toLowerCase().trim();
  const estado = document.getElementById('filter-hist-estado')?.value || '';
  const tipo = document.getElementById('filter-hist-tipo')?.value || '';
  const clasif = document.getElementById('filter-hist-clasificacion')?.value || '';

  hist_filtradas = hist_todas_solicitudes.filter(item => {
    if (q) {
      const matchId = (item.idSolicitud || '').toLowerCase().includes(q);
      const matchSol = (item.solicitante || '').toLowerCase().includes(q);
      const matchCC = (item.codigoCC || '').toLowerCase().includes(q);
      if (!matchId && !matchSol && !matchCC) return false;
    }
    if (estado && (item.estadoSolicitud || '').toUpperCase() !== estado.toUpperCase()) return false;
    if (tipo && (item.tipoViatico || '').toLowerCase() !== tipo.toLowerCase()) return false;
    if (clasif && (item.clasificacionSolicitud || '').toLowerCase() !== clasif.toLowerCase()) return false;

    return true;
  });

  // Ordenar por fecha descendente
  hist_filtradas.sort((a, b) => {
    const da = parseFechaHoraHistorico(a.fechaSolicitud);
    const db = parseFechaHoraHistorico(b.fechaSolicitud);
    return hist_sort_desc ? (db - da) : (da - db);
  });

  hist_page = 1;
  renderTablaHistorico();
}

function parseFechaHoraHistorico(str) {
  if (!str) return new Date(0);
  const parts = str.split(' ');
  const dateParts = parts[0].split('/');
  if (dateParts.length === 3) {
    const day = parseInt(dateParts[0]);
    const month = parseInt(dateParts[1]) - 1;
    const year = parseInt(dateParts[2]);
    let hour = 0, min = 0;
    if (parts[1]) {
      const timeParts = parts[1].split(':');
      hour = parseInt(timeParts[0]) || 0;
      min = parseInt(timeParts[1]) || 0;
    }
    return new Date(year, month, day, hour, min);
  }
  return new Date(str);
}

/**
 * Renderiza la tabla histórica.
 */
function renderTablaHistorico() {
  const tbody = document.getElementById('hist-tabla-body');
  const countLabel = document.getElementById('hist-contador-registros');
  const total = hist_filtradas.length;

  if (total === 0) {

      ? '<span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-semibold bg-purple-100 text-purple-800">Reintegro</span>'
      : '<span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-semibold bg-blue-100 text-blue-800">Anticipo</span>';

    return `
      <tr class="hover:bg-surface-container-low transition-colors">
        <td class="py-3 px-3 text-center font-bold text-primary text-xs align-middle">
          ${item.idSolicitud}
        </td>

          ${item.solicitante}
        </td>

          ${item.montoFormatted || ('$ ' + parseFloat(item.monto || 0).toFixed(2))}

          <span class="bg-surface-container px-2 py-0.5 rounded font-mono text-[11px]">${item.codigoCC || '-'}</span>
        </td>
        <td class="py-3 px-3 text-center text-xs text-on-surface-variant align-middle">
          <div class="font-medium text-on-surface">${item.fechaSolicitud ? item.fechaSolicitud.split(' ')[0] : '-'}</div>
        </td>
        <td class="py-3 px-3 text-center align-middle">
          ${badgeEstado}
        </td>
        <td class="py-3 px-3 text-center text-xs font-medium text-on-surface align-middle">
          ${item.tipoViatico}
        </td>
        <td class="py-3 px-3 text-center align-middle">
          ${badgeClasif}
        </td>

          <button onclick="verExpedienteHistorico('${item.idSolicitud}')" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-primary-container text-on-primary hover:bg-primary text-xs font-bold transition-colors cursor-pointer shadow-xs">
            <span class="material-symbols-outlined text-sm">visibility</span>
            Ver detalles
          </button>
        </td>
      </tr>
    `;
  }).join('');

  renderPaginacionHistorico(total, Math.ceil(total / hist_page_size));
}

function generarBadgeEstadoHistorico(estado) {
  const est = (estado || '').toUpperCase();
  if (est === 'FINALIZADO') {
    return '<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-300"><i class="fas fa-check-circle text-[10px]"></i>FINALIZADO</span>';
  } else if (est === 'CANCELADO') {
    return '<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-gray-100 text-gray-800 border border-gray-300"><i class="fas fa-ban text-[10px]"></i>CANCELADO</span>';
  } else if (est === 'RECHAZO-AUTORIZACION') {
    return '<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-red-100 text-red-800 border border-red-300"><i class="fas fa-times-circle text-[10px]"></i>RECHAZO-AUTORIZACIÓN</span>';
  }
  return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold bg-gray-100 text-gray-800">${est}</span>`;
}

function renderPaginacionHistorico(total, totalPages) {
  const container = document.getElementById('hist-paginacion-controles');
  if (!container) return;

  if (totalPages <= 1) {
    container.innerHTML = '';
    return;
  }

  let html = `
    <button onclick="cambiarPaginaHistorico(${hist_page - 1})" ${hist_page === 1 ? 'disabled' : ''} class="px-3 py-1 border border-outline-variant rounded text-xs font-medium hover:bg-surface-container transition-colors disabled:opacity-40 disabled:pointer-events-none cursor-pointer">
      Anterior
    </button>
  `;

  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || (i >= hist_page - 1 && i <= hist_page + 1)) {
      html += `
        <button onclick="cambiarPaginaHistorico(${i})" class="px-3 py-1 border ${i === hist_page ? 'bg-primary text-on-primary font-bold border-primary' : 'border-outline-variant hover:bg-surface-container'} rounded text-xs transition-colors cursor-pointer">
          ${i}
        </button>
      `;
    } else if (i === hist_page - 2 || i === hist_page + 2) {
      html += `<span class="px-1 text-xs text-outline">...</span>`;
    }
  }

  html += `
    <button onclick="cambiarPaginaHistorico(${hist_page + 1})" ${hist_page === totalPages ? 'disabled' : ''} class="px-3 py-1 border border-outline-variant rounded text-xs font-medium hover:bg-surface-container transition-colors disabled:opacity-40 disabled:pointer-events-none cursor-pointer">
      Siguiente
    </button>
  `;

  container.innerHTML = html;
}

function cambiarPaginaHistorico(p) {
  hist_page = p;
  renderTablaHistorico();
}

function cambiarPageSizeHistorico(size) {
  hist_page_size = parseInt(size) || 10;
  hist_page = 1;
  renderTablaHistorico();
}

function toggleSortDateHistorico() {
  hist_sort_desc = !hist_sort_desc;
  const icon = document.getElementById('hist-sort-icon');
  if (icon) icon.className = hist_sort_desc ? 'fas fa-sort-down text-xs text-primary' : 'fas fa-sort-up text-xs text-primary';
  filtrarTablaHistorico();
}

function limpiarFiltrosHistorico() {
  const fields = ['filter-hist-search', 'filter-hist-estado', 'filter-hist-tipo', 'filter-hist-clasificacion'];
  fields.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  filtrarTablaHistorico();
}

/**

function poblarExpedienteHistorico(exp) {

  document.getElementById('hist-det-viatico-tipo').textContent = exp.tipoViatico || '-';

  document.getElementById('hist-det-banco').textContent = exp.banco || '-';
  document.getElementById('hist-det-tipo-cuenta').textContent = exp.tipoCuenta || '-';
  document.getElementById('hist-det-num-cuenta').textContent = exp.numeroCuenta || '-';
  document.getElementById('hist-det-motivo').textContent = exp.motivoViatico || '-';

  const esEdit = (exp.esEditado === 'Si' || exp.esEditado === 'SI');
  const badgeEdit = document.getElementById('hist-det-es-editado-badge');

        <tr class="hover:bg-surface-container-low transition-colors">
          <td class="py-2 px-3 text-center font-semibold text-primary">${aut.nombre || ('Nivel ' + aut.nivel)}</td>
          <td class="py-2 px-3 text-center text-on-surface-variant">${aut.fecha || '-'}</td>
          <td class="py-2 px-3 text-center">
            <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-bold ${aut.resolucion === 'APROBADO' ? 'bg-emerald-100 text-emerald-800' : aut.resolucion === 'RECHAZADO' ? 'bg-red-100 text-red-800' : 'bg-gray-100 text-gray-800'}">
              ${aut.resolucion || 'REGISTRADO'}
            </span>
          </td>
          <td class="py-2 px-3 text-left text-on-surface leading-relaxed">${aut.comentario || '-'}</td>
        </tr>
      `).join('');
    }
  } else {
    secAut?.classList.add('hidden');
  }

  // 5. BLOQUE CONDICIONAL: PROVISIÓN (COMPRAS)
  const secProv = document.getElementById('hist-seccion-provision');
  if (exp.nombreProvision || exp.fechaProvision || exp.agrupableProvision) {
    secProv?.classList.remove('hidden');
    document.getElementById('hist-det-prov-nombre').textContent = exp.nombreProvision || 'Gestor Compras';
    document.getElementById('hist-det-prov-fecha').textContent = exp.fechaProvision || '-';
    document.getElementById('hist-det-prov-res').textContent = exp.resolucionProvision || 'Aprobado';
    document.getElementById('hist-det-prov-comentario').textContent = exp.comentarioProvision || 'Provisión contable aprobada.';

    const asientoCard = document.getElementById('hist-det-prov-asiento-card');
    if (exp.agrupableProvision) {
      asientoCard?.classList.remove('hidden');
      document.getElementById('hist-as-prov-fcont').textContent = exp.agrupableProvision.fechaContable || '-';
      document.getElementById('hist-as-prov-fval').textContent = exp.agrupableProvision.fechaValor || '-';
      document.getElementById('hist-as-prov-mod').textContent = exp.agrupableProvision.modulo || '-';
      document.getElementById('hist-as-prov-tra').textContent = exp.agrupableProvision.transaccion || '-';
      document.getElementById('hist-as-prov-cod').textContent = exp.agrupableProvision.codigoRelacion || '-';
      document.getElementById('hist-as-prov-cr').textContent = exp.agrupableProvision.crFse || '-';
    } else {
      asientoCard?.classList.add('hidden');
    }
  } else {
    secProv?.classList.add('hidden');
  }

  // 6. BLOQUE CONDICIONAL: PROCESAMIENTO PAGO (TESORERÍA)
  const secProc = document.getElementById('hist-seccion-procesamiento');
  if (exp.nombreProcesamiento || exp.fechaProcesamiento || exp.agrupableProcesamiento) {
    secProc?.classList.remove('hidden');
    document.getElementById('hist-det-proc-nombre').textContent = exp.nombreProcesamiento || 'Gestor Tesorería';
    document.getElementById('hist-det-proc-fecha').textContent = exp.fechaProcesamiento || '-';
    document.getElementById('hist-det-proc-res').textContent = exp.resolucionProcesamiento || 'Aprobado';
    document.getElementById('hist-det-proc-comentario').textContent = exp.comentarioProcesamiento || 'Desembolso bancario ejecutado.';

    const asientoCardP = document.getElementById('hist-det-proc-asiento-card');
    if (exp.agrupableProcesamiento) {
      asientoCardP?.classList.remove('hidden');
      document.getElementById('hist-as-proc-fcont').textContent = exp.agrupableProcesamiento.fechaContable || '-';
      document.getElementById('hist-as-proc-fval').textContent = exp.agrupableProcesamiento.fechaValor || '-';
      document.getElementById('hist-as-proc-mod').textContent = exp.agrupableProcesamiento.modulo || '-';
      document.getElementById('hist-as-proc-tra').textContent = exp.agrupableProcesamiento.transaccion || '-';
      document.getElementById('hist-as-proc-cod').textContent = exp.agrupableProcesamiento.codigoRelacion || '-';
      document.getElementById('hist-as-proc-cr').textContent = exp.agrupableProcesamiento.crFse || '-';
    } else {
      asientoCardP?.classList.add('hidden');
    }
  } else {
    secProc?.classList.add('hidden');
  }

  // 7. BLOQUE CONDICIONAL: LIQUIDACIÓN Y CIERRE (SOLICITANTE Y COMPRAS)
  const secCierre = document.getElementById('hist-seccion-cierre');
  if (exp.fechaCierreS || exp.nombreCierreE || exp.agrupableCierreE || exp.montoReintegro > 0) {
    secCierre?.classList.remove('hidden');
    document.getElementById('hist-det-cierre-tipo').textContent = exp.tipoCierre || 'Solo cierre';
    document.getElementById('hist-det-cierre-monto').textContent = exp.montoReintegro ? ('$ ' + parseFloat(exp.montoReintegro).toFixed(2)) : '$ 0.00';
    document.getElementById('hist-det-cierre-fechas').textContent = exp.fechaCierreS || '-';
    document.getElementById('hist-det-cierre-fechae').textContent = exp.fechaCierreE || '-';

    const boxCompras = document.getElementById('hist-det-cierre-compras-box');
    if (exp.nombreCierreE) {
      boxCompras?.classList.remove('hidden');
      document.getElementById('hist-det-cierre-nombre-e').textContent = exp.nombreCierreE;
      document.getElementById('hist-det-cierre-res-e').textContent = exp.resolucionCierreE || 'Aprobado';
      document.getElementById('hist-det-cierre-comentario-e').textContent = exp.comentarioCierreE || '-';
    } else {
      boxCompras?.classList.add('hidden');
    }

    const asientoCardC = document.getElementById('hist-det-cierre-asiento-card');
    if (exp.agrupableCierreE) {
      asientoCardC?.classList.remove('hidden');
      document.getElementById('hist-as-cierre-fcont').textContent = exp.agrupableCierreE.fechaContable || '-';
      document.getElementById('hist-as-cierre-fval').textContent = exp.agrupableCierreE.fechaValor || '-';
      document.getElementById('hist-as-cierre-mod').textContent = exp.agrupableCierreE.modulo || '-';
      document.getElementById('hist-as-cierre-tra').textContent = exp.agrupableCierreE.transaccion || '-';
      document.getElementById('hist-as-cierre-cod').textContent = exp.agrupableCierreE.codigoRelacion || '-';
      document.getElementById('hist-as-cierre-cr').textContent = exp.agrupableCierreE.crFse || '-';
    } else {
      asientoCardC?.classList.add('hidden');
    }
  } else {
    secCierre?.classList.add('hidden');
  }
}

function regresarTablaHistorico() {
  const bandeja = document.getElementById('historico-bandeja');
  const detalle = document.getElementById('view-historico-detalle');

  if (detalle) detalle.classList.add('vista-oculta');
  if (bandeja) bandeja.classList.remove('hidden');
}

function imprimirExpedienteHistorico() {
  window.print();
}
</script>
